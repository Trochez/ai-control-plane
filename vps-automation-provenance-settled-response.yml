                        - code [ref=f8e1916]: "set -Eeuo pipefail umask 077 RUN=\"R20260923T012014\" SHA=\"0c11a13e0c6ceb4c9eab3258ce4a10728fcb6390\" WF=\"0f6fcfa4-4fb0-419d-ba4d-ca77af5d0c62\" PPL=\"4df05bd2-6a81-41dc-9dfe-9e0051cd602c\" ROOT=\"/var/lib/ai-loop\" LOG=\"$ROOT/logs/${RUN}.v3.log\" E=\"$(mktemp -d \"/tmp/ai-loop-local-forensics-${RUN}.XXXXXX\")\" fail() { echo \"LOCAL_CONTROL_PLANE_FORENSICS=FAILED\" echo \"BLOCKER=$1\" echo \"EVIDENCE_DIR=$E\" exit \"${2:-90}\" } for c in python3 grep sed awk find stat sha256sum journalctl ps; do command -v \"$c\" >/dev/null 2>&1 || fail \"MISSING_COMMAND:$c\" 91 done test -r \"$LOG\" || fail \"RUN_LOG_NOT_READABLE:$LOG\" 92 echo \"RUN=$RUN\" echo \"TARGET_SHA=$SHA\" echo \"WORKFLOW_ID=$WF\" echo \"PIPELINE_ID=$PPL\" echo \"EVIDENCE_DIR=$E\" ############################################################################### # 1. Preserve hashes only. No source file is modified. ############################################################################### echo \"===== SOURCE EVIDENCE HASHES =====\" sha256sum \"$LOG\" | tee \"$E/run-log.sha256\" find \"$ROOT/state\" \\ -maxdepth 1 \\ -type f \\ -name \"${RUN}*\" \\ -print 2>/dev/null \\ | sort \\ | while IFS= read -r f; do sha256sum \"$f\" done \\ | tee \"$E/state-files.sha256\" ############################################################################### # 2. Exact run chronology. ############################################################################### echo echo \"===== EXACT RUN CHRONOLOGY =====\" grep -nE \\ \"$SHA|$WF|$PPL|CI UNKNOWN|CI SUCCESS|CI FAILURE|raw_result|raw_state|Semaphore|signal=15|phase=|FAILURE_ANALYSIS|IMPLEMENTING|CI_WATCH|EVIDENCE|TimeoutExpired|NOT_FOUND|controller\" \\ \"$LOG\" \\ >\"$E/run-chronology.txt\" || true cat \"$E/run-chronology.txt\" ############################################################################### # 3. First/last relevant events and SIGTERM chronology. ############################################################################### echo echo \"===== KEY EVENT SUMMARY =====\" python3 - \"$LOG\" \"$SHA\" \"$WF\" \"$PPL\" <<'PY' \\ | tee \"$E/key-events.txt\" import re import sys path, sha, wf, ppl = sys.argv[1:] patterns = { \"candidate\": re.compile(re.escape(sha)), \"workflow\": re.compile(re.escape(wf)), \"pipeline\": re.compile(re.escape(ppl)), \"ci_unknown\": re.compile(r\"\\bCI UNKNOWN\\b\"), \"ci_failure\": re.compile(r\"\\bCI FAILURE\\b\"), \"ci_success\": re.compile(r\"\\bCI SUCCESS\\b\"), \"signal15\": re.compile(r\"controller signal=15\"), \"timeout\": re.compile(r\"TimeoutExpired|timed out\", re.I), \"semaphore_not_found\": re.compile(r\"SEMAPHORE_EXACT_ANCHORS_NOT_FOUND\"), \"failure_analysis\": re.compile(r\"phase=FAILURE_ANALYSIS\"), } events = {k: [] for k in patterns} with open(path, encoding=\"utf-8\", errors=\"replace\") as fh: for lineno, line in enumerate(fh, 1): for key, rx in patterns.items(): if rx.search(line): events[key].append((lineno, line.rstrip())) for key, values in events.items(): print(f\"{key.upper()}_COUNT={len(values)}\") if values: print(f\"{key.upper()}_FIRST_LINE={values[0][0]}\") print(f\"{key.upper()}_FIRST={values[0][1]}\") print(f\"{key.upper()}_LAST_LINE={values[-1][0]}\") print(f\"{key.upper()}_LAST={values[-1][1]}\") PY ############################################################################### # 4. Context around every controller SIGTERM. ############################################################################### echo echo \"===== SIGTERM CONTEXT =====\" python3 - \"$LOG\" <<'PY' \\ | tee \"$E/sigterm-context.txt\" import sys path = sys.argv[1] with open(path, encoding=\"utf-8\", errors=\"replace\") as fh: lines = fh.readlines() hits = [ i for i, line in enumerate(lines) if \"controller signal=15\" in line ] print(f\"SIGTERM_COUNT={len(hits)}\") for seq, idx in enumerate(hits, 1): print(f\"--- SIGTERM_{seq}_CONTEXT_BEGIN ---\") lo = max(0, idx - 12) hi = min(len(lines), idx + 13) for j in range(lo, hi): print(f\"{j+1}:{lines[j].rstrip()}\") print(f\"--- SIGTERM_{seq}_CONTEXT_END ---\") PY ############################################################################### # 5. State JSON: print only diagnostic allowlisted fields. # Do not dump URLs, prompts, credentials, or browser payloads. ############################################################################### echo echo \"===== STATE SNAPSHOT =====\" STATE_FILES=\"$( find \"$ROOT/state\" \\ -maxdepth 1 \\ -type f \\ -name \"${RUN}*.json\" \\ -print 2>/dev/null \\ | sort )\" if [ -z \"$STATE_FILES\" ]; then echo \"STATE_FILE=NOT_FOUND\" else while IFS= read -r state; do [ -n \"$state\" ] || continue echo \"STATE_FILE=$state\" stat -c \\ 'STATE_STAT mtime=%y size=%s uid=%u gid=%g mode=%a' \\ \"$state\" 2>/dev/null || true python3 - \"$state\" <<'PY' import json import sys path = sys.argv[1] try: with open(path, encoding=\"utf-8\") as fh: obj = json.load(fh) except Exception as exc: print(f\"STATE_JSON_READ=FAILED:{type(exc).__name__}:{exc}\") raise SystemExit(0) wanted = { \"run_id\", \"phase\", \"stage\", \"failure_stage\", \"baseline_sha\", \"candidate_sha\", \"candidate\", \"iteration\", \"go_confirmed\", \"last_ci\", \"ci_status\", \"ci_provider\", \"breaker_state\", \"breaker_route\", \"last_dispatched_provider\", \"last_dispatched_sha\", \"workflow_id\", \"pipeline_id\", \"run_id\", \"status\", \"raw_state\", \"raw_result\", \"reason\", } def walk(value, path=\"\"): if isinstance(value, dict): for key, val in value.items(): here = f\"{path}.{key}\" if path else key if key in wanted: if isinstance(val, (str, int, float, bool)) or val is None: print(f\"STATE {here}={val!r}\") elif isinstance(val, dict): safe = {} for k, v in val.items(): if k in wanted and ( isinstance(v, (str, int, float, bool)) or v is None ): safe[k] = v print( f\"STATE {here}=\" + json.dumps(safe, sort_keys=True) ) walk(val, here) elif isinstance(value, list): for i, item in enumerate(value): walk(item, f\"{path}[{i}]\") walk(obj) PY done <<<\"$STATE_FILES\" fi | tee \"$E/state-diagnostic.txt\" ############################################################################### # 6. Search existing LOCAL AI-loop evidence only. # No remote/network calls. ############################################################################### echo echo \"===== LOCAL EXACT-ID ARTIFACT INDEX =====\" for base in \\ /var/lib/ai-loop \\ /opt/ai-loop/evidence do [ -d \"$base\" ] || continue grep -RIl \\ --binary-files=without-match \\ -e \"$SHA\" \\ -e \"$WF\" \\ -e \"$PPL\" \\ \"$base\" 2>/dev/null \\ | head -n 200 done \\ | sort -u \\ | tee \"$E/local-artifact-index.txt\" ############################################################################### # 7. Extract only lines relevant to stop/status chronology from those files. ############################################################################### echo echo \"===== LOCAL ARTIFACT RELEVANT LINES =====\" while IFS= read -r f; do [ -r \"$f\" ] || continue echo \"--- FILE=$f ---\" grep -nE \\ \"$SHA|$WF|$PPL|raw_result|raw_state|stopped|signal=15|TimeoutExpired|SEMAPHORE_EXACT_ANCHORS_NOT_FOUND|CI UNKNOWN|CI FAILURE|FAILURE_ANALYSIS\" \\ \"$f\" 2>/dev/null \\ | tail -n 160 \\ || true done <\"$E/local-artifact-index.txt\" \\ | tee \"$E/local-artifact-relevant-lines.txt\" ############################################################################### # 8. Read-only system journal correlation around FIRST known incident window. # # Known interesting period: # 2026-09-23 19:03-19:09 UTC CI UNKNOWN -> controller signal=15. ############################################################################### echo echo \"===== SYSTEM JOURNAL 18:30-20:40 UTC =====\" set +e journalctl \\ --since \"2026-09-23 18:30:00 UTC\" \\ --until \"2026-09-23 20:40:00 UTC\" \\ --no-pager \\ -o short-iso 2>/dev/null \\ | grep -Ei \\ 'ai-loop|ai-loopd|opencode|python|SIGTERM|signal|terminat|killed|kill|oom|out of memory|systemd|cron|nohup' \\ >\"$E/journal-incident-window.txt\" journal_rc=${PIPESTATUS[0]} set -e if [ \"$journal_rc\" -eq 0 ]; then cat \"$E/journal-incident-window.txt\" else echo \"SYSTEM_JOURNAL=UNAVAILABLE_OR_INCOMPLETE rc=$journal_rc\" fi ############################################################################### # 9. User journal, if available. ############################################################################### echo echo \"===== USER JOURNAL 18:30-20:40 UTC =====\" set +e journalctl \\ --user \\ --since \"2026-09-23 18:30:00 UTC\" \\ --until \"2026-09-23 20:40:00 UTC\" \\ --no-pager \\ -o short-iso 2>/dev/null \\ | grep -Ei \\ 'ai-loop|ai-loopd|opencode|python|SIGTERM|signal|terminat|killed|kill|systemd' \\ >\"$E/user-journal-incident-window.txt\" uj_rc=${PIPESTATUS[0]} set -e if [ \"$uj_rc\" -eq 0 ]; then cat \"$E/user-journal-incident-window.txt\" else echo \"USER_JOURNAL=UNAVAILABLE_OR_INCOMPLETE rc=$uj_rc\" fi ############################################################################### # 10. Narrow shell-history check for explicit controller lifecycle commands. # No general history dump. ############################################################################### echo echo \"===== LOCAL LIFECYCLE COMMAND HISTORY =====\" HIST=\"$HOME/.bash_history\" if [ -r \"$HIST\" ]; then grep -En \\ '(/opt/ai-loop/bin/)?(stop-loop-v3|restart-loop-v3|resume-current-v3|kill-all-loop-v3)|pkill .*ai-loop|kill .*ai-loopd|systemctl .*ai-loop' \\ \"$HIST\" 2>/dev/null \\ | tail -n 80 \\ | sed -E \\ 's/([A-Za-z0-9_]*(TOKEN|PASSWORD|SECRET|KEY)[A-Za-z0-9_]*)=[^ ]+/\\1=<REDACTED>/Ig' \\ | tee \"$E/lifecycle-history.txt\" else echo \"BASH_HISTORY=UNAVAILABLE\" fi ############################################################################### # 11. Current installed controller version / file metadata only. ############################################################################### echo echo \"===== CONTROLLER FILE METADATA =====\" for f in \\ /opt/ai-loop/ai-loopd-v3.py \\ /opt/ai-loop/bin/ci-status \\ /opt/ai-loop/bin/start-loop-v3 \\ /opt/ai-loop/bin/stop-loop-v3 \\ /opt/ai-loop/bin/restart-loop-v3 \\ /opt/ai-loop/bin/resume-current-v3 \\ /opt/ai-loop/bin/kill-all-loop-v3 do if [ -e \"$f\" ]; then stat -c \\ 'FILE path=%n mtime=%y size=%s uid=%u gid=%g mode=%a' \\ \"$f\" else echo \"FILE_ABSENT=$f\" fi done | tee \"$E/controller-file-metadata.txt\" ############################################################################### # 12. Current process snapshot. Observation only. ############################################################################### echo echo \"===== CURRENT AI-LOOP PROCESS SNAPSHOT =====\" ps -eo \\ pid=,ppid=,lstart=,etime=,args= 2>/dev/null \\ | grep -E \\ 'ai-loopd-v3|browser-broker|opencode run' \\ | grep -v '[g]rep -E' \\ | tee \"$E/current-processes.txt\" \\ || true ############################################################################### # 13. Produce deterministic summary from the gathered LOCAL evidence. ############################################################################### echo echo \"===== FORENSIC CLASSIFICATION =====\" python3 - \\ \"$E/run-chronology.txt\" \\ \"$E/sigterm-context.txt\" \\ \"$E/journal-incident-window.txt\" \\ \"$E/user-journal-incident-window.txt\" \\ <<'PY' | tee \"$E/classification.txt\" import pathlib import re import sys files = [pathlib.Path(x) for x in sys.argv[1:]] text = \"\\n\".join( p.read_text(encoding=\"utf-8\", errors=\"replace\") for p in files if p.exists() ) checks = { \"CI_UNKNOWN_OBSERVED\": r\"\\bCI UNKNOWN\\b\", \"CONTROLLER_SIGTERM_OBSERVED\": r\"controller signal=15\", \"EXACT_SHA_OBSERVED\": r\"0c11a13e0c6ceb4c9eab3258ce4a10728fcb6390\", \"EXACT_WORKFLOW_OBSERVED\": r\"0f6fcfa4-4fb0-419d-ba4d-ca77af5d0c62\", \"EXACT_PIPELINE_OBSERVED\": r\"4df05bd2-6a81-41dc-9dfe-9e0051cd602c\", \"TIMEOUT_OBSERVED\": r\"TimeoutExpired|timed out\", \"ANCHOR_NOT_FOUND_OBSERVED\": r\"SEMAPHORE_EXACT_ANCHORS_NOT_FOUND\", \"OOM_OR_KERNEL_KILL_EVIDENCE\": r\"oom-kill|out of memory|Killed process\", \"SYSTEMD_STOP_EVIDENCE\": r\"Stopping .*a