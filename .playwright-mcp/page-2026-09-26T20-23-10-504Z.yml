'PY' \\ | tee \"$E/compare-summary.txt\" import json import sys path, target, remote = sys.argv[1:] with open(path, encoding=\"utf-8\") as fh: d = json.load(fh) print(\"COMPARE_STATUS=\" + str(d.get(\"status\"))) print(\"AHEAD_BY=\" + str(d.get(\"ahead_by\"))) print(\"BEHIND_BY=\" + str(d.get(\"behind_by\"))) print(\"TOTAL_COMMITS=\" + str(d.get(\"total_commits\"))) base = (d.get(\"base_commit\") or {}).get(\"sha\") merge = (d.get(\"merge_base_commit\") or {}).get(\"sha\") print(\"BASE_COMMIT=\" + str(base)) print(\"MERGE_BASE=\" + str(merge)) if base != target: print(\"TARGET_BASE_MATCH=NO\") raise SystemExit(31) if merge != target: print(\"TARGET_MERGE_BASE_MATCH=NO\") raise SystemExit(32) print(\"TARGET_BASE_MATCH=YES\") print(\"TARGET_MERGE_BASE_MATCH=YES\") commits = d.get(\"commits\") or [] print(f\"SUCCESSOR_COMMIT_COUNT={len(commits)}\") for i, c in enumerate(commits, 1): sha = c.get(\"sha\") commit = c.get(\"commit\") or {} msg = (commit.get(\"message\") or \"\").replace(\"\\n\", \" | \") author = commit.get(\"author\") or {} committer = commit.get(\"committer\") or {} parents = \",\".join( p.get(\"sha\", \"\") for p in (c.get(\"parents\") or []) ) print(f\"SUCCESSOR_{i}_SHA={sha}\") print(f\"SUCCESSOR_{i}_PARENTS={parents}\") print(f\"SUCCESSOR_{i}_AUTHOR_DATE={author.get('date')}\") print(f\"SUCCESSOR_{i}_COMMITTER_DATE={committer.get('date')}\") print(f\"SUCCESSOR_{i}_MESSAGE={msg}\") print(\"CHANGED_FILES_BEGIN\") for f in d.get(\"files\") or []: print( \"{}\\t{}\\t+{}\\t-{}\".format( f.get(\"status\"), f.get(\"filename\"), f.get(\"additions\", 0), f.get(\"deletions\", 0), ) ) print(\"CHANGED_FILES_END\") PY ############################################################################### # 4. Extract successor SHAs deterministically. ############################################################################### python3 - \"$E/compare.json\" >\"$E/successor-shas.txt\" <<'PY' import json import sys with open(sys.argv[1], encoding=\"utf-8\") as fh: d = json.load(fh) for c in d.get(\"commits\") or []: sha = c.get(\"sha\") if sha: print(sha) PY COUNT=\"$(wc -l <\"$E/successor-shas.txt\" | tr -d ' ')\" echo \"SUCCESSOR_COUNT=$COUNT\" if [ \"$COUNT\" -ne 2 ]; then echo \"EXPECTED_SUCCESSOR_COUNT=2\" echo \"ACTUAL_SUCCESSOR_COUNT=$COUNT\" echo \"BRANCH_MOVED_SINCE_PREVIOUS_VERIFICATION=YES\" echo \"EVIDENCE_DIR=$E\" exit 40 fi ############################################################################### # 5. Read exact metadata for each successor commit. ############################################################################### n=0 while IFS= read -r sha; do n=$((n + 1)) gh api \\ -H \"Accept: application/vnd.github+json\" \\ \"/repos/$OWNER/$NAME/commits/$sha\" \\ >\"$E/successor-${n}.json\" python3 - \"$E/successor-${n}.json\" \"$n\" <<'PY' import json import sys path = sys.argv[1] n = sys.argv[2] with open(path, encoding=\"utf-8\") as fh: d = json.load(fh) commit = d.get(\"commit\") or {} author = commit.get(\"author\") or {} committer = commit.get(\"committer\") or {} print(f\"===== SUCCESSOR {n} =====\") print(\"SHA=\" + str(d.get(\"sha\"))) print( \"PARENTS=\" + \",\".join(p.get(\"sha\", \"\") for p in d.get(\"parents\") or []) ) print(\"AUTHOR=\" + str(author.get(\"name\"))) print(\"AUTHOR_DATE=\" + str(author.get(\"date\"))) print(\"COMMITTER=\" + str(committer.get(\"name\"))) print(\"COMMITTER_DATE=\" + str(committer.get(\"date\"))) print( \"MESSAGE=\" + (commit.get(\"message\") or \"\").replace(\"\\n\", \" | \") ) print(\"FILES_BEGIN\") for f in d.get(\"files\") or []: print( \"{}\\t{}\\t+{}\\t-{}\".format( f.get(\"status\"), f.get(\"filename\"), f.get(\"additions\", 0), f.get(\"deletions\", 0), ) ) print(\"FILES_END\") PY done <\"$E/successor-shas.txt\" \\ | tee \"$E/successor-details.txt\" ############################################################################### # 6. Retrieve historical vs current Semaphore pipeline definitions. ############################################################################### get_file_at_ref() { ref=\"$1\" out=\"$2\" gh api \\ -H \"Accept: application/vnd.github.raw+json\" \\ \"/repos/$OWNER/$NAME/contents/.semaphore/semaphore-production.yml?ref=$ref\" \\ >\"$out\" } get_file_at_ref \\ \"$TARGET\" \\ \"$E/semaphore-production.target.yml\" get_file_at_ref \\ \"$REMOTE_HEAD\" \\ \"$E/semaphore-production.current.yml\" ############################################################################### # 7. Exact pipeline diff. ############################################################################### echo \"===== SEMAPHORE PIPELINE DIFF =====\" set +e diff -u \\ \"$E/semaphore-production.target.yml\" \\ \"$E/semaphore-production.current.yml\" \\ >\"$E/semaphore-production.diff\" diff_rc=$? set -e cat \"$E/semaphore-production.diff\" case \"$diff_rc\" in 0) echo \"SEMAPHORE_PIPELINE_CHANGED=NO\" ;; 1) echo \"SEMAPHORE_PIPELINE_CHANGED=YES\" ;; *) fail \"PIPELINE_DIFF_FAILED:$diff_rc\" 94 ;; esac ############################################################################### # 8. Classify whether successors touch the failed execution domain. ############################################################################### python3 - \\ \"$E/compare.json\" <<'PY' \\ | tee \"$E/successor-classification.txt\" import json import sys with open(sys.argv[1], encoding=\"utf-8\") as fh: d = json.load(fh) files = { f.get(\"filename\", \"\") for f in (d.get(\"files\") or []) } domains = { \"SEMAPHORE_PIPELINE\": any( x.startswith(\".semaphore/\") for x in files ), \"FULL_CORPUS_RUNTIME\": any( \"full_corpus\" in x for x in files ), \"DEPLOY_CONTRACT\": any( x.endswith(\"prepare_deploy_contract.sh\") or x.endswith(\"deploy_feature_gru_remote.sh\") for x in files ), \"P2_RUNTIME\": any( \"p2\" in x.lower() for x in files ), } for key, val in domains.items(): print(f\"{key}_CHANGED={'YES' if val else 'NO'}\") material = ( domains[\"SEMAPHORE_PIPELINE\"] or domains[\"FULL_CORPUS_RUNTIME\"] or domains[\"DEPLOY_CONTRACT\"] ) print( \"SUCCESSORS_MATERIALLY_CHANGE_STOPPED_PATH=\" + (\"YES\" if material else \"NO\") ) PY ############################################################################### # 9. Re-prove no source checkout mutation. ############################################################################### git -C \"$REPO\" rev-parse HEAD \\ >\"$E/local-head.after\" git -C \"$REPO\" status --porcelain=v1 -uall \\ >\"$E/local-status.after\" cmp -s \\ \"$E/local-head.before\" \\ \"$E/local-head.after\" || fail \"LOCAL_HEAD_CHANGED\" 95 cmp -s \\ \"$E/local-status.before\" \\ \"$E/local-status.after\" || fail \"LOCAL_WORKTREE_CHANGED\" 96 ############################################################################### # 10. Evidence manifest. ############################################################################### find \"$E\" \\ -maxdepth 1 \\ -type f \\ ! -name SHA256SUMS \\ -print0 \\ | sort -z \\ | xargs -0 sha256sum \\ >\"$E/SHA256SUMS\" echo echo \"===== FINAL PREFLIGHT STATE =====\" echo \"TARGET_SHA=$TARGET\" echo \"CURRENT_REMOTE_HEAD=$REMOTE_HEAD\" echo \"SUCCESSOR_COUNT=$COUNT\" grep \\ 'SUCCESSORS_MATERIALLY_CHANGE_STOPPED_PATH=' \\ \"$E/successor-classification.txt\" echo \"LOCAL_SOURCE_MUTATION=NO\" echo \"GITHUB_MUTATION=NO\" echo \"SEMAPHORE_QUERY=NO\" echo \"SEMAPHORE_RERUN=NO\" echo \"VPS_QUERY=NO\" echo \"VPS_MUTATION=NO\" echo \"DEPLOYMENT=NO\" echo \"COMMIT_OR_PUSH=NO\" echo \"BRANCH_SUCCESSOR_PREFLIGHT=PASS\" echo \"EVIDENCE_DIR=$E\""
