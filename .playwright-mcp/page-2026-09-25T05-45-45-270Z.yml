7: reasoning=high 658: chat absent 659: 660: read 5: 661: reasoning=high 662: chat present+selected 663: ``` 664: 665: Expected: 666: 667: ```text 668: PASS 669: no outer retry 670: no premature timeout 671: ``` 672: 673: ## Regression R160843-B — observer object truthiness 674: 675: Observer returns: 676: 677: ```json 678: {\"surface_actionable\": false} 679: ``` 680: 681: for the first four reads. 682: 683: Expected: 684: 685: ```text 686: wait continues 687: ``` 688: 689: On fifth read: 690: 691: ```json 692: {\"surface_actionable\": true} 693: ``` 694: 695: Expected: 696: 697: ```text 698: wait completes 699: ``` 700: --- 700-897 --- 700: 701: ## Regression R160843-C — startup probe deferred 702: 703: Existing run resumes while Chat surface is not hydrated. 704: 705: Expected: 706: 707: ```text 708: STARTUP_POLICY=DEFERRED 709: controller remains alive 710: no Send 711: FSM read-only reconciliation continues 712: ``` 713: 714: ## Regression R160843-D — hard gate later succeeds 715: 716: After deferred startup, before a later evidence Send: 717: 718: ```text 719: Chat hydrates 720: High selected 721: ``` 722: 723: Expected: 724: 725: ```text 726: HARD_POLICY_GATE=PASS 727: Send occurs exactly once 728: ``` 729: 730: --- 731: 732: # 11. Release gates 733: 734: | Gate | Requirement | 735: |---|---| 736: | G0 | evidence frozen | 737: | G1 | R160843-A regression green | 738: | G2 | R160843-B regression green | 739: | G3 | startup deferral green | 740: | G4 | hard pre-Send gate green | 741: | G5 | project/fresh-draft regressions green | 742: | G6 | attachment regressions green | 743: | G7 | restart/idempotency matrix green | 744: | G8 | assistant/semantic/action path green | 745: | G9 | local/GitHub/VPS/Semaphore paths green | 746: | G10 | CI/replan path green | 747: | G11 | 100/100 synthetic loops GO | 748: | G12 | live Ubuntu safe canary FINAL_GO | 749: | G13 | real target loop FINAL_GO | 750: | G14 | independent audit approves evidence | 751: | G15 | clean release artifact + manifest | 752: 753: No gate may be skipped. 754: 755: --- 756: 757: # 12. Expected healthy live log 758: 759: A successful resume/start may legitimately show: 760: 761: ```text 762: ai-loopd-v3 version=4.6.0 ... 763: BROWSER_BROKER=PASS ... 764: STARTUP_POLICY PROBE_DEFERRED reason=surface_not_hydrated 765: STARTUP_POLICY controller_continues_read_only=true 766: ``` 767: 768: This is acceptable because no Send is occurring. 769: 770: Before an outbound message, the log MUST show: 771: 772: ```text 773: OUTBOUND_POLICY HARD_GATE purpose=... 774: CHAT_SURFACE PASS surface=chat 775: MODEL_GUARD PASS model=gpt-5.6-sol reasoning=high 776: DELIVERY_READY ... 777: DELIVERY_SENT ... 778: DELIVERY_PROOF PASS ... 779: ``` 780: 781: The final live run must end with: 782: 783: ```text 784: FINAL_GO_VALIDATED ... 785: AI_LOOP_COMPLETE=GO 786: ``` 787: 788: --- 789: 790: # 13. Pre-mortem 791: 792: ## Failure 1 — startup deferral accidentally weakens Send safety 793: 794: **Mitigation** 795: - one central outbound Send function; 796: - hard policy gate inside that function; 797: - source-wide audit; 798: - test that every outbound message passes through it. 799: 800: ## Failure 2 — hydration bug moves from Chat surface to reasoning control 801: 802: **Mitigation** 803: - independent surface and reasoning state machines; 804: - explicit condition predicates; 805: - delayed-control fixtures. 806: 807: ## Failure 3 — controller remains alive but spins forever 808: 809: **Mitigation** 810: - bounded read-only reconciliation intervals; 811: - phase progress watchdog; 812: - structured diagnostics; 813: - no blind high-frequency polling. 814: 815: ## Failure 4 — later live stage exposes new untested bug 816: 817: **Mitigation** 818: - mandatory recursive fix-until-GO protocol; 819: - team cannot stop at first downstream failure. 820: 821: --- 822: 823: # 14. ADR 824: 825: ## Decision 826: 827: Make startup policy verification non-fatal for transient hydration failures, while making the pre-Send policy gate stronger and centralized. 828: 829: ## Why 830: 831: Startup/read-only reconciliation has no outbound side effect and therefore does not need to die because a visual control has not mounted yet. 832: 833: Outbound Send is the safety boundary. 834: 835: ## Consequences 836: 837: Positive: 838: 839: - resume is resilient to transient UI hydration; 840: - no weaker Send protection; 841: - fewer unnecessary daemon restarts; 842: - clearer separation between read-only reconciliation and side effects. 843: 844: Costs: 845: 846: - controller policy state becomes two-mode; 847: - requires comprehensive outbound-message audit. 848: 849: --- 850: 851: # 15. Team execution command 852: 853: Run in an OpenCode session: 854: 855: ```text 856: /team implement completely IMPLEMENTATION_PLAN_AI_LOOP_V4_6_STARTUP_POLICY_DEFERRED_GUARD_20260922T2357-0500.md; execute all local, integration, restart, synthetic and live Ubuntu tests required by the plan. If any bug appears during live testing, capture evidence, add a regression, fix it, rerun the full suite and rerun a brand-new canary. Do not finish until a real live loop reaches independently validated FINAL_GO / AI_LOOP_COMPLETE=GO. 857: ``` 858: 859: --- 860: 861: # 16. Independent verification command 862: 863: After `/team` claims completion: 864: 865: ```text 866: /ralph verify every invariant, task acceptance, restart matrix, R20260922T160843 regressions, 100-loop soak, live Ubuntu tool round-trips, FINAL_GO evidence and release gate G0-G15 in IMPLEMENTATION_PLAN_AI_LOOP_V4_6_STARTUP_POLICY_DEFERRED_GUARD_20260922T2357-0500.md. Do not accept source assertions or partial logs as proof. 867: ``` 868: 869: --- 870: 871: # 17. Definition of Done 872: 873: v4.6 is complete only when: 874: 875: ```text 876: [PASS] reasoning-before-Chat regression 877: [PASS] truthy-object wait regression 878: [PASS] startup policy hydration timeout does not kill controller 879: [PASS] startup deferral never authorizes Send 880: [PASS] every outbound Send executes hard Chat/Sol/High gate 881: [PASS] previous project/fresh-draft fixes remain green 882: [PASS] previous attachment fixes remain green 883: [PASS] restart matrix has zero duplicate side effects 884: [PASS] local action live 885: [PASS] GitHub live 886: [PASS] VPS live 887: [PASS] Semaphore live 888: [PASS] multiple evidence Sends live 889: [PASS] 100/100 synthetic loops GO 890: [PASS] safe Ubuntu live canary FINAL_GO 891: [PASS] real target loop FINAL_GO 892: [PASS] no uncaught Python/Node exception in final acceptance 893: [PASS] independent audit G0-G15 894: ``` 895: 896: Anything less is an unfinished release candidate."
